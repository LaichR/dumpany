[package]
name = "dumpany-python"
authors = ["LaichR"]
version = "0.1.0"
edition = "2024"
description = "Generate structured text with line wrapping, indentation, alignment, and custom separators"
license = "MIT"
repository = "https://github.com/LaichR/dumpany"
readme = "README.md"
publish = false

[lib]
name = "dumpany"
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
dumpany-rs = { package="dumpany", path = "../rust" }
pyo3 = { version = "0.29.0", features = ["abi3-py310", "multiple-pymethods"] }
pyo3-stub-gen = "0.23.1"



[features]
extension-module = ["pyo3/extension-module"]

[[bin]]
name = "generate_type_stubs"
path = "tools/generate_type_stubs.rs"
