[package]
name = "dumpany-python"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "dumpany"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
dumpany = { path = "../rust" }
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }

[features]
extension-module = ["pyo3/extension-module"]
