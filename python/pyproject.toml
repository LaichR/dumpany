[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "dumpany"
dynamic = ["version"]
description = "Generate structured text with line wrapping, indentation, alignment, and custom separators"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name="LaichR"}]
keywords = ["text", "formatting", "indentation", "alignment", "pretty-printing"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Text Processing",
]

[project.urls]
Documentation = "https://laichr.github.io/dumpany/python/"
Repository = "https://github.com/LaichR/dumpany"
Issues = "https://github.com/LaichR/dumpany/issues"
Changelog = "https://github.com/LaichR/dumpany/blob/main/python/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
module-name = "dumpany"
features = ["extension-module"]
include = [{ path = "dumpany.pyi", format = "sdist" }]
