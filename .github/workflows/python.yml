name: Python wheels

on:
  workflow_call:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
      - name: Download Python type stubs
        uses: actions/download-artifact@v8.0.2
        with:
          name: python-type-stubs
          path: python
      - name: Build wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          command: build
          args: --release --locked --manifest-path python/Cargo.toml --out dist
          manylinux: auto
      - name: Install wheel
        run: python -m pip install --no-index --find-links dist dumpany
      - name: Check installed wheel
        run: python -I python/tools/check_installation.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dumpany-wheels-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
      - name: Download Python type stubs
        uses: actions/download-artifact@v8.0.2
        with:
          name: python-type-stubs
          path: python
      - name: Build source distribution
        uses: PyO3/maturin-action@v1.51.0
        with:
          command: sdist
          args: --manifest-path python/Cargo.toml --out dist
      - name: Install source distribution
        run: python -m pip install dist/*.tar.gz
      - name: Check installed source distribution
        run: python -I python/tools/check_installation.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dumpany-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
