name: Python wheels

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Python stream adapter
        run: cargo test --locked -p dumpany-python
        env:
          PYO3_PYTHON: python
      - name: Generate Python type stubs
        run: cargo run --locked -p dumpany-python --bin generate_type_stubs
        env:
          PYO3_PYTHON: python
      - name: Build wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          command: build
          args: --release --locked --manifest-path python/Cargo.toml --out dist
          manylinux: auto
      - name: Install wheel and test dependencies
        run: python -m pip install --no-index --find-links dist dumpany
      - run: python -m pip install pytest
      - name: Test installed wheel
        run: python -m pytest python/tests
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dumpany-wheels-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Python type stubs
        run: cargo run --locked -p dumpany-python --bin generate_type_stubs
        env:
          PYO3_PYTHON: python
      - name: Build source distribution
        uses: PyO3/maturin-action@v1.51.0
        with:
          command: sdist
          args: --manifest-path python/Cargo.toml --out dist
      - name: Install source distribution
        run: python -m pip install dist/*.tar.gz pytest
      - name: Test installed source distribution
        run: python -m pytest python/tests
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dumpany-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
