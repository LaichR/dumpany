name: CI

on:
  push:
    branches: [main]
  workflow_call:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Formatting and Clippy
    runs-on: ubuntu-24.04
    env:
      PYO3_PYTHON: python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: Rust tests and doctests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Run Rust tests and doctests
        run: cargo test --locked -p dumpany --all-features

  python-stubs:
    name: Python type stubs
    runs-on: ubuntu-24.04
    needs: [python-test, lint, test]
    env:
      PYO3_PYTHON: python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2.9.3
        with: 
          shared-key: python-test
      - name: Generate Python type stubs
        run: cargo run --release --locked -p dumpany-python --bin generate_type_stubs
      - name: Upload Python type stubs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: python-type-stubs
          path: python/dumpany.pyi
          if-no-files-found: error

  python-test:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-24.04"]') || fromJSON('["ubuntu-24.04", "windows-latest", "macos-15"]') }}
    env:
      PYO3_PYTHON: python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: python-test
      - name: Create test environment
        uses: ./.github/actions/setup-python-environment
      - name: Install test tools
        run: python -m pip install "./python[test]"
      - name: Test Python stream adapter
        run: cargo test --locked -p dumpany-python
      - name: Run Python tests
        run: python -m pytest python/tests

  python:
    name: Python packages
    needs: [lint, test, python-stubs, python-test]
    uses: ./.github/workflows/python.yml

  docs:
    name: Documentation
    needs: [lint, test, python-stubs, python-test]
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
