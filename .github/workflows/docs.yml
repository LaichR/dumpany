name: Documentation

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    concurrency:
      group: docs-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install documentation dependencies
        run: python -m pip install -r python/docs/requirements.txt
      - name: Generate Python type stubs
        run: cargo run --locked -p dumpany-python --bin generate_type_stubs
        env:
          PYO3_PYTHON: python
      - name: Build Python documentation
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("python/Cargo.toml", "rb"))["package"]["version"])')
          python -m sphinx -W --keep-going -b html -D release="$version" python/docs _site/python
      - name: Add documentation landing page
        run: cp .github/pages/index.html _site/index.html
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.event.repository.private == false
        uses: actions/configure-pages@v6.0.0
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.event.repository.private == false
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    name: Publish documentation
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.event.repository.private == false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
