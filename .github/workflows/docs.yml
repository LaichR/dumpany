name: Documentation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Install documentation dependencies
        run: python -m pip install -r python/docs/requirements.txt
      - name: Download Python type stubs
        uses: actions/download-artifact@v8.0.2
        with:
          name: python-type-stubs
          path: python
      - name: Build Python documentation
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("python/Cargo.toml", "rb"))["package"]["version"])')
          python -m sphinx -W --keep-going -b html -D release="$version" python/docs _site/python
      - name: Add documentation landing page
        run: cp .github/pages/index.html _site/index.html
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event.repository.private == false
        uses: actions/configure-pages@v6.0.0
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event.repository.private == false
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    name: Publish documentation
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
